name: Build exe and release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: Сборка exe
        run: node tools/build_exe.js

      - name: Проверка сборки
        shell: pwsh
        run: |
          $f = Get-Item ozvuchka.exe
          "exe: $([math]::Round($f.Length/1MB,1)) МБ"
          "версия: $($f.VersionInfo.FileVersion)"
          "имя: $($f.VersionInfo.ProductName)"
          "SHA256: $((Get-FileHash ozvuchka.exe -Algorithm SHA256).Hash)"
          $bytes = [System.IO.File]::ReadAllBytes("ozvuchka.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $sub = [BitConverter]::ToUInt16($bytes, $pe + 4 + 20 + 68)
          "PE subsystem: $sub (2 = без консоли)"
          if ($sub -ne 2) { throw "exe собран с консолью (subsystem $sub)" }

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: Озвучка текста v1.3 — свой голос и запуск без консоли
          body: |
            **Скачай `ozvuchka.exe` и запусти — откроется окно программы, чёрного окна консоли больше нет.**

            ### Что нового в 1.3
            - **Озвучка своим голосом по записи** — новая вкладка «Свой голос».
            - **Запуск без консоли**: приложение ведёт себя как обычная программа Windows.
            - **Заставка при старте** — без надписей, только логотип и полоска прогресса.
            - Вкладки «Голоса программы» и «Свой голос».

            ### Две функции
            - **Голоса программы**: 309 голосов, 74 языка, субтитры `.srt` с точным временем по каждому слову.
            - **Свой голос**: 10–15 секунд записи — и текст читается твоим тембром. Считается локально, никуда не отправляется.

            ### Важно про «свой голос»
            Нужен отдельный движок (Python + модель ~2 ГБ), он ставится один раз и живёт в папке `engine` рядом с программой — инструкция в README. Без движка программа работает, вкладка просто скажет, что он не установлен.
            Скорость на процессоре: примерно 8 секунд работы на 1 секунду речи.

            Windows может предупредить, что файл без цифровой подписи: «Подробнее» → «Выполнить всё равно».
          files: ozvuchka.exe
          make_latest: true
