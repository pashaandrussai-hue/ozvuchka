name: Build exe and release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: Сборка exe
        run: node tools/build_exe.js

      - name: Проверка сборки
        shell: pwsh
        run: |
          $f = Get-Item ozvuchka.exe
          "exe: $([math]::Round($f.Length/1MB,1)) МБ"
          "версия: $($f.VersionInfo.FileVersion)"
          "имя: $($f.VersionInfo.ProductName)"
          "SHA256: $((Get-FileHash ozvuchka.exe -Algorithm SHA256).Hash)"

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: Озвучка текста v1.2 — приложение для Windows
          body: |
            **Скачай `ozvuchka.exe` и запусти — откроется окно программы.** Ничего устанавливать не нужно.

            ### Что нового в 1.2
            - Настоящее окно приложения: без адресной строки и вкладок, со своей иконкой.
            - Второй запуск не создаёт копию — поднимается уже открытое окно.
            - Закрыл окно — программа выключилась сама, не висит в процессах.
            - Кнопки «Открыть папку» и «Выход».
            - Иконка и реквизиты файла (версия 1.2), а не значок Node.js.

            ### Что внутри
            - 309 голосов, 74 языка.
            - Субтитры `.srt` с точным временем по каждому слову — прямо в CapCut/Premiere.
            - Файлы сохраняются в папку `output` рядом с программой.

            Windows может предупредить, что файл без цифровой подписи: «Подробнее» → «Выполнить всё равно». Подписи нет, потому что она стоит денег, а программа бесплатная.
          files: ozvuchka.exe
          make_latest: true
